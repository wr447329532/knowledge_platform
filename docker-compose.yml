version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kp_db
    restart: always
    environment:
      POSTGRES_DB: knowledge_platform
      POSTGRES_USER: kp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kp_user -d knowledge_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # 本地构建：默认 knowledge_platform-app:latest
    # 服务器拉 GHCR：在 .env 中设置 DOCKER_IMAGE_APP=ghcr.io/<小写owner>/knowledge_platform-app:latest
    image: ${DOCKER_IMAGE_APP:-knowledge_platform-app:latest}
    container_name: kp_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: postgresql+psycopg2://kp_user:${POSTGRES_PASSWORD}@db:5432/knowledge_platform
      STORAGE_ROOT: /app/storage
      STORAGE_SYSTEM_TOTAL_BYTES: ${STORAGE_SYSTEM_TOTAL_BYTES:-536870912000}
      MAX_UPLOAD_FILE_BYTES: ${MAX_UPLOAD_FILE_BYTES:-2147483648}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://192.168.150.99}
      BOOTSTRAP_DEFAULT_ADMIN: "true"
      RESET_DEFAULT_ADMIN_PASSWORD_ON_STARTUP: "false"
      DB_AUTO_CREATE_TABLES_ON_STARTUP: "false"
      DB_COMPAT_PATCH_ON_STARTUP: "false"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    volumes:
      - /data/storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8000"

  nginx:
    image: ${DOCKER_IMAGE_NGINX:-knowledge_platform-nginx:latest}
    container_name: kp_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"

volumes:
  postgres_data:
  storage_data: