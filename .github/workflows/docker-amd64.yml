# linux/amd64 在 GitHub 原生构建并推 GHCR；服务器只需 docker compose pull && up（见 deploy/.env.example.ghcr）。
# 手动运行：Actions → 本 workflow → Run workflow。
name: Docker linux/amd64 → GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-amd64.yml"
      - "backend/**"
      - "frontend/**"
      - "requirements.txt"
      - ".dockerignore"
      - "alembic/**"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 小写 owner（Docker 标签要求）
        id: meta
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push base（apt / LibreOffice，缓存命中时不重做）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/knowledge_platform-base:latest
          build-args: USE_CN_MIRROR=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push app（代码 + pip，依赖上一步 base）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/knowledge_platform-app:latest
          build-args: |
            USE_CN_MIRROR=0
            BASE_IMAGE=ghcr.io/${{ steps.meta.outputs.owner_lc }}/knowledge_platform-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx（含前端构建）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/knowledge_platform-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
