# 推荐：linux/amd64 镜像在 GitHub 上打（原生 amd64 + Debian 源稳定），避免本机 Mac 模拟 amd64 慢、apt 502。
# 使用：Actions → 本 workflow → Run workflow。产物推 GHCR :latest。
# 服务器：docker login ghcr.io 后 docker pull ghcr.io/<小写 owner>/knowledge_platform-app:latest（nginx 同理）。
name: Docker linux/amd64 → GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 小写 owner（Docker 标签要求）
        id: meta
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/knowledge_platform-app:latest
          build-args: USE_CN_MIRROR=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx（含前端构建）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/knowledge_platform-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
